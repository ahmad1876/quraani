name: Quraani daily

on:
  schedule:
    - cron: "17 1 * * *"   # every day 03:17 South Africa time: makes tomorrow's videos
    - cron: "17 13 * * *"  # 15:17 South Africa time: safety net, only acts if something is missing
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = make + schedule, check = test the setup, dry-run = render 2 previews only, rerender = redo scheduled videos in the current style, new-footage = redo scheduled videos with fresh clips"
        type: choice
        options: [daily, check, dry-run, rerender, new-footage]
        default: daily

permissions:
  contents: write
  pages: write

concurrency:
  group: quraani
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QURAANI_SECRETS: ${{ secrets.QURAANI_SECRETS }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        # normally about a minute; a stuck package mirror once hung this for 30+ minutes,
        # so each attempt has a time limit and the step tries up to 3 times
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update  # skip the slow manual-page rebuild after installing
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            if sudo -E timeout 180 apt-get $APT update -qq &&
               sudo -E timeout 300 apt-get $APT install -y -qq ffmpeg fonts-dejavu-core > /dev/null; then
              ffmpeg -version | head -1
              exit 0
            fi
            echo "ffmpeg install attempt $i did not finish, trying again"
            sudo -E dpkg --configure -a || true  # finish anything the time limit interrupted
            sleep 10
          done
          exit 1

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/ms-playwright
            .cache/http
            .cache/models
            .cache/cbr_probe.json
            .cache/footage_rejected.json
          key: quraani-${{ runner.os }}-${{ github.run_id }}
          restore-keys: quraani-${{ runner.os }}-

      - name: Install Python packages
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          pip install -q -r requirements.txt
          python -m playwright install chromium > /dev/null
          # the browser's system libraries come from Ubuntu's packages too; the runner image already has
          # them (it ships Chrome), so a stuck package server must not hold the job here
          timeout 300 python -m playwright install-deps chromium > /dev/null ||
            echo "Browser system libraries step did not finish in time: carrying on with the runner's own"

      - name: Check setup
        if: ${{ github.event.inputs.mode == 'check' }}
        run: python scripts/check_setup.py

      - name: Render two preview videos (nothing is posted)
        if: ${{ github.event.inputs.mode == 'dry-run' }}
        run: python scripts/batch.py 2 out

      - name: Re-render scheduled videos in the current style
        if: ${{ github.event.inputs.mode == 'rerender' }}
        run: python scripts/rerender.py

      - name: Re-render scheduled videos with fresh footage
        if: ${{ github.event.inputs.mode == 'new-footage' }}
        run: python scripts/rerender.py --new-footage

      - name: Make and schedule videos
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'daily' }}
        run: python scripts/daily.py

      - name: Save rotation state
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.mode == 'daily' || github.event.inputs.mode == 'new-footage') }}
        run: |
          git config user.name "quraani-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -q -m "state $(date -u +%F)"
          for i in 1 2 3; do
            if git pull -q --rebase && git push -q; then exit 0; fi
            sleep 10
          done
          echo "Could not save state/ to the repo"; exit 1

      - name: Keep dry-run videos for preview
        if: ${{ github.event.inputs.mode == 'dry-run' }}
        uses: actions/upload-artifact@v6
        with:
          name: preview-videos
          path: |
            out/*.mp4
            out/*.txt
          retention-days: 3
